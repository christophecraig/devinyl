# Plan task S.6, technical-spec.md §17 (drift detection) — the scheduled half
# of the Gate-0 catalog probe.
#
# scripts/catalog-probe.ts hits the LIVE Deezer API and measures whether the
# tracks Devinyl's quizzes are built from are still findable, still have a
# working 30 s preview, and still hydrate to a genre + release date. Gate 0
# passed it once at 97.6 % against a ≥ 95 % bar (see plan task 0.3). Nothing
# about that number is permanent: Deezer's catalog changes underneath us —
# rights lapse, reissues drop genres, preview URLs stop resolving — and the
# failure mode is silent. Quizzes just quietly start containing more unplayable
# rounds.
#
# So this runs weekly and FAILS the job when the combined pass rate drops below
# 95 %. The alert is GitHub's own "scheduled workflow failed" email to the repo
# owner; there is no other notification channel wired, and none is needed.
#
# The probe script itself always exits 0 on a completed run (it reports rates,
# it does not judge them) — the "Enforce ≥ 95 %" step below is what turns its
# JSON report into a build status. The script is left untouched on purpose: it
# is a zero-dependency, standalone Gate-0 artifact, and its numbers are quoted
# verbatim in docs/catalog-probe-report.md.
#
# Reads nothing secret and touches no Cloudflare resource — no deploy
# credentials are exposed to this workflow at all.

name: Weekly catalog probe

on:
  schedule:
    # 04:17 UTC every Sunday — deliberately off-peak (05:17/06:17 Paris, on the
    # quietest day) and deliberately not on the hour, since GitHub queues
    # scheduled jobs at :00 heavily enough to delay them. Cron is UTC-only.
    - cron: '17 4 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Deezer catalog coverage (≥ 95 %)
    runs-on: ubuntu-latest
    # The probe is rate-limited to Deezer's 50 requests / 5 s window and walks
    # 85 track probes + 10 artist probes + 8 theme probes + a CORS sample, with
    # retries and backoff. Generous ceiling so a slow/throttled Deezer shows up
    # as a real failure rather than a timeout.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # The probe has ZERO app dependencies (Node builtins + fetch only), so
        # this is not strictly required to run it — it is here so the checkout
        # matches every other job and so a lockfile break surfaces here too.
        run: pnpm install --frozen-lockfile

      - name: Run catalog probe against live Deezer
        # One of the two invocations the script's own header documents. The
        # other is `npx tsx@latest scripts/catalog-probe.ts`; `tsx` is not a
        # dependency of this repo and pulling it from the network on every
        # scheduled run would add a failure mode that has nothing to do with
        # Deezer, so the built-in type-stripping path is used instead (Node 22
        # needs the flag; 23+ strips by default).
        #
        # Writes scripts/.probe-results.json (gitignored) and prints a summary
        # to stderr. Exits non-zero only if the run itself blew up.
        run: node --experimental-strip-types scripts/catalog-probe.ts

      - name: 'Enforce ≥ 95 % combined pass rate (MUS-8, §17 drift detection)'
        # Runs even if the probe step failed part-way, so a partial report is
        # still surfaced rather than swallowed.
        if: always()
        run: |
          cat > "$RUNNER_TEMP/gate.mjs" <<'EOF'
          import { readFile } from 'node:fs/promises';
          import { appendFile } from 'node:fs/promises';

          const BAR = 95; // MUS-8 / plan task 0.3's go/no-go bar.
          const REPORT = 'scripts/.probe-results.json';

          let raw;
          try {
            raw = await readFile(REPORT, 'utf-8');
          } catch {
            console.error(
              `FAIL: ${REPORT} was never written — the probe did not complete a run.`
            );
            process.exit(1);
          }

          const { summary, runAt } = JSON.parse(raw);
          // Counts, not the pre-formatted "97.6%" strings, so the comparison is
          // done on real numbers rather than on parsed display output.
          const { trackCombinedPassCount: pass, trackTotal: total } = summary;
          if (!Number.isFinite(pass) || !Number.isFinite(total) || total === 0) {
            console.error(`FAIL: unusable summary in ${REPORT}: ${JSON.stringify(summary)}`);
            process.exit(1);
          }

          const rate = (pass / total) * 100;
          const ok = rate >= BAR;
          const lines = [
            `## Deezer catalog probe — ${ok ? 'PASS' : 'FAIL'}`,
            '',
            `Run at ${runAt}`,
            '',
            `| Metric | Value |`,
            `| --- | --- |`,
            `| Combined track pass | ${pass}/${total} (${rate.toFixed(1)}%) |`,
            `| Bar | ${BAR}% |`,
            `| Found | ${summary.trackFoundRate} |`,
            `| Preview 200/206 | ${summary.trackPreviewOkRate} |`,
            `| Album hydration | ${summary.trackHydrationOkRate} |`,
            `| Artist probes | ${summary.artistPassRate} |`,
            `| CORS header present | ${summary.corsAllOriginPresent}/${summary.corsSampleSize} |`
          ];
          if (process.env.GITHUB_STEP_SUMMARY) {
            await appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }
          console.log(lines.join('\n'));

          if (!ok) {
            console.error(
              `\nFAIL: combined pass rate ${rate.toFixed(1)}% is below the ${BAR}% bar ` +
                `(${total - pass} of ${total} probe tracks are no longer usable). ` +
                `Deezer catalog coverage has drifted — download the probe-results artifact ` +
                `and check which tracks fail and why (not found / preview dead / no genre).`
            );
            process.exit(1);
          }
          EOF
          node "$RUNNER_TEMP/gate.mjs"

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-probe-results
          path: scripts/.probe-results.json
          # Long enough to compare a failing run against several prior weeks and
          # tell a one-off Deezer wobble from real, sustained drift.
          retention-days: 90
          if-no-files-found: warn
