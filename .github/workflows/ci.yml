# Plan task 4.3 (§4 perf-budget table + Phase 0.5's never-built S.6).
# `build-and-test` runs with zero deploy credentials: lint, typecheck,
# unit/integration tests against local D1, a local `vite build`, a bundle-size
# budget, Playwright (incl. axe, A11Y-1), and Lighthouse against the built app
# served locally.
#
# `deploy` (added once S.1's CLOUDFLARE_API_TOKEN secret existed) runs only on
# push to master, after build-and-test passes: applies pending D1 migrations to
# the remote `devinyl` database, then `wrangler deploy`s the Worker. Migrations
# run before the code deploy so new columns/tables exist before code that
# reads them ships — see the devinyl-deployment memory note on migration drift.
#
# Known, deliberate gaps (see docs/implementation-plan.md task 4.3's note):
#   - Server p95 API latency (§4 table) is NOT measured here — no production
#     traffic exists yet, and local D1/Miniflare timings aren't
#     representative of anything. Deferred to task 4.14 (launch checklist).
#   - Lighthouse's "Fast 3G" throttling is simulated (lighthouserc.cjs),
#     not a real mobile network — also called out there.
#
# `deploy-preview` runs only on pull requests from branches in THIS repo
# (forks get no secrets), after build-and-test passes: migrates the throwaway
# `devinyl-preview` D1 database, deploys the `preview` environment from
# wrangler.jsonc as a separate Worker, and posts/updates a single PR comment
# with the URL. All PRs share that one Worker and database — last push wins.

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Quiets wrangler's update-check network call and telemetry ping — CI has
  # no interactive terminal for the prompt either would otherwise print to.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build-and-test:
    name: lint, typecheck, test, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local-dev secrets
        # Copies the placeholder values .dev.vars.example documents (see
        # that file's header) — `wrangler types` (part of `check`/`build`)
        # and the D1-backed integration/e2e runs all need *some* value for
        # IP_HASH_SECRET/BETTER_AUTH_SECRET, and there is no real secret to
        # leak here: production values only ever live in `wrangler secret`.
        run: cp .dev.vars.example .dev.vars

      - name: Lint
        run: pnpm run lint

      - name: Generate Paraglide messages
        # svelte-check (part of `check`, below) reads $lib/paraglide/messages.js
        # straight off disk — unlike Vitest/`vite build`, it doesn't go through
        # Vite's transform pipeline, so paraglideVitePlugin (vite.config.ts)
        # never runs for it. The directory is gitignored (generated), so a
        # fresh checkout has nothing there until this runs explicitly.
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --strategy cookie preferredLanguage baseLocale --silent

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        # Must run before the integration suite below: those tests boot the
        # real Workers runtime via worker/entry.ts, which imports
        # .svelte-kit/cloudflare/_worker.js — the artifact adapter-cloudflare
        # only writes here, during `vite build`. Unit tests don't need it
        # (plain node/jsdom, no adapter output involved), so they stay ahead
        # of Build; this step can't move ahead of them.
        run: pnpm run build

      - name: Integration tests (local D1 via vitest-pool-workers)
        run: pnpm run test:integration

      - name: 'Bundle-size budget (§4: initial JS < 60 KB gzip, landing/play route)'
        run: node scripts/check-bundle-size.mjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (incl. axe, A11Y-1 — fails on serious/critical violations)
        run: pnpm exec playwright test

      - name: 'Lighthouse (§4: LCP < 2.5s, simulated Fast-3G — see lighthouserc.cjs)'
        run: pnpm exec lhci autorun --config=lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: deploy (devinyl)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-devinyl
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local-dev secrets
        # Only needed so `wrangler types` (part of `pnpm build`) has a value to
        # introspect — production's real secrets live in `wrangler secret` and
        # are untouched by this file. See ci job's identical step.
        run: cp .dev.vars.example .dev.vars

      - name: Build
        run: pnpm run build

      - name: Apply pending D1 migrations (remote)
        # `--env=""` explicitly targets wrangler.jsonc's TOP-LEVEL config. Once
        # any `env.*` block exists (the `preview` one does), wrangler warns on a
        # bare invocation and asks for the target to be named — say it, rather
        # than let a future second environment turn this into a coin flip about
        # which database production CI migrates.
        run: pnpm exec wrangler d1 migrations apply devinyl --remote --env=""

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --env=""

  deploy-preview:
    name: deploy preview (devinyl-preview)
    needs: build-and-test
    # Pull requests only, and only from branches pushed to this repository:
    # `pull_request` from a fork runs without access to secrets, so
    # CLOUDFLARE_API_TOKEN would be empty and every wrangler step would fail
    # with an auth error on every external contribution. Skip instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      # Serialized against itself, not cancelled: two PRs deploying at once
      # would race on the same Worker and the same D1 database (see the
      # `env.preview` comment in wrangler.jsonc — last push wins, by design),
      # and a cancelled `d1 migrations apply` is worse than a slow queue.
      group: deploy-devinyl-preview
      cancel-in-progress: false
    permissions:
      contents: read
      # For the preview-URL comment below.
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://devinyl-preview.restless-mode-79fb.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Local-dev secrets
        # Same as the other jobs: `wrangler types` (part of `pnpm build`) needs
        # values to introspect. The preview Worker's actual runtime values come
        # from wrangler.jsonc's `env.preview.vars` — the one place committed
        # placeholder "secrets" are intentional, because the environment and its
        # database are both throwaway. See that file's comment.
        run: cp .dev.vars.example .dev.vars

      - name: Build
        run: pnpm run build

      - name: Apply pending D1 migrations (remote, preview DB)
        # Migrations before code, same ordering rule as production.
        run: pnpm exec wrangler d1 migrations apply devinyl-preview --remote --env preview

      - name: Deploy preview Worker
        run: pnpm exec wrangler deploy --env preview

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            // Idempotent: find this job's own comment by the HTML marker and
            // edit it, so a PR with twenty pushes still has exactly one
            // preview comment showing the latest deploy.
            const MARKER = '<!-- devinyl-preview-url -->';
            const body = [
              MARKER,
              '### Preview deploy',
              '',
              `**${process.env.PREVIEW_URL}**`,
              '',
              `Deployed from \`${context.sha.slice(0, 7)}\` at ${new Date().toISOString()}.`,
              '',
              'Heads up: every PR shares this one preview Worker and its `devinyl-preview`',
              'D1 database — the most recent push to any open PR is what is live here.',
              'Placeholder auth/IP-hash secrets, no Google OAuth, no Resend, no Sentry.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
